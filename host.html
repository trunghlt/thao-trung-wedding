<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Host · Guest invite links</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body { font-family: "Cormorant Garamond", Georgia, serif; max-width: 720px; margin: 0 auto; padding: 2rem 1rem; background: #f3ebe1; color: #3d3429; }
    h1 { font-size: 1.8rem; }
    .muted { color: #8aa08c; margin-bottom: 1.25rem; }
    textarea { width: 100%; min-height: 140px; padding: 0.75rem; border: 1px solid #b8954a88; border-radius: 8px; font: inherit; }
    button { margin-top: 0.75rem; padding: 0.6rem 1rem; border-radius: 999px; border: 1px solid #b8954a; background: #b8954a; color: #fffaf4; font: inherit; letter-spacing: 0.06em; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; background: #fffaf4; border-radius: 10px; overflow: hidden; }
    th, td { text-align: left; padding: 0.7rem 0.85rem; border-bottom: 1px solid #eadfce; vertical-align: top; }
    th { font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; color: #5f7a63; }
    a { color: #9a7a38; word-break: break-all; }
    .copy { font-size: 0.85rem; margin-left: 0.5rem; cursor: pointer; border: none; background: transparent; color: #5f7a63; text-decoration: underline; }
  </style>
</head>
<body>
  <h1>Guest invite links</h1>
  <p class="muted">Paste one guest name per line. Each gets a personalized public link. This page is for you — don’t share it with guests.</p>
  <textarea id="names" placeholder="Anh Minh&#10;Chị Lan&#10;Gia đình Uncle John"></textarea>
  <div>
    <button type="button" id="make">Generate links</button>
  </div>
  <table id="out" hidden>
    <thead><tr><th>Guest</th><th>Link</th></tr></thead>
    <tbody></tbody>
  </table>
  <script>
    var base = location.origin + location.pathname.replace(/host\.html$/, "") ;
    if (!base.endsWith("/")) base += "/";
    document.getElementById("make").onclick = function () {
      var lines = document.getElementById("names").value.split(/\n/).map(function (s) { return s.trim(); }).filter(Boolean);
      var tb = document.querySelector("#out tbody");
      tb.innerHTML = "";
      lines.forEach(function (name) {
        var url = base + "?to=" + encodeURIComponent(name);
        var tr = document.createElement("tr");
        tr.innerHTML = "<td></td><td><a href=\"\" target=\"_blank\" rel=\"noopener\"></a> <button type=\"button\" class=\"copy\">Copy</button></td>";
        tr.cells[0].textContent = name;
        var a = tr.querySelector("a");
        a.href = url; a.textContent = url;
        tr.querySelector(".copy").onclick = function () {
          navigator.clipboard.writeText(url).catch(function () {});
          this.textContent = "Copied";
        };
        tb.appendChild(tr);
      });
      document.getElementById("out").hidden = lines.length === 0;
    };
  </script>
</body>
</html>
