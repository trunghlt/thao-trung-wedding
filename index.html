<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Thao & Trung — You're Invited</title>
  <meta name="description" content="You're invited to the wedding of Thao & Trung — Saturday, 26 December 2026 at 4:00 PM, Furama Resort, Da Nang, Vietnam." />
  <meta property="og:title" content="Thao & Trung — Wedding Invitation" />
  <meta property="og:description" content="Saturday, 26 December 2026 · 4:00 PM · Furama Resort, Da Nang" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="og.jpg" />
  <meta name="theme-color" content="#e8dcc8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sand: #f4ebe0;
      --cream: #fffaf4;
      --sage: #5f7a63;
      --sage-soft: #8aa08c;
      --gold: #b8954a;
      --gold-deep: #9a7a38;
      --ink: #3d3429;
      --shadow: rgba(61, 52, 41, 0.16);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      font-family: "Cormorant Garamond", Georgia, serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, #f0f5ee 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 100%, #efe4d2 0%, transparent 50%),
        linear-gradient(165deg, #e7efe8 0%, #f3ebe1 42%, #e6d7c2 100%);
      line-height: 1.45;
      overflow-x: hidden;
    }

    .page {
      width: min(920px, 100%);
      margin: 0 auto;
      padding: 1.5rem 1rem 3.5rem;
      position: relative;
      z-index: 1;
    }

    .guest-hello {
      display: none;
      font-size: clamp(1.35rem, 4.5vw, 1.75rem);
      font-style: italic;
      color: var(--gold-deep);
      margin-bottom: 0.85rem;
    }
    .guest-hello.is-on { display: block; }

    .hero-intro {
      text-align: center;
      padding: 1.75rem 0.5rem 1.25rem;
      animation: fadeUp 0.9s ease both;
    }
    .hero-intro .eyebrow {
      font-size: 0.78rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--sage);
      margin-bottom: 0.65rem;
    }
    .hero-intro .names {
      font-family: "Great Vibes", cursive;
      font-size: clamp(2.6rem, 9vw, 3.8rem);
      line-height: 1.1;
      color: var(--ink);
    }
    .hero-intro .amp {
      display: inline-block;
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: 0.55em;
      color: var(--gold);
      margin: 0 0.15em;
      vertical-align: 0.12em;
    }
    .hero-intro .sub {
      margin-top: 0.7rem;
      font-style: italic;
      color: var(--sage-soft);
      font-size: 1.1rem;
    }

    /* Card + scenery stage */
    .card-stage {
      position: relative;
      margin: 0.5rem auto 1.75rem;
      animation: fadeUp 1s 0.15s ease both;
      filter: drop-shadow(0 22px 40px var(--shadow));
    }
    .card-wrap {
      position: relative;
      overflow: hidden;
      border-radius: 6px;
      border: 1px solid rgba(184, 149, 74, 0.35);
      background: var(--cream);
      isolation: isolate;
    }
    .invite-card {
      display: block;
      width: 100%;
      height: auto;
      transform-origin: 52% 38%;
      will-change: transform;
      animation: kenBurns 28s ease-in-out infinite alternate;
    }

    /* Soft shimmer over sky / beach band (upper ~55%) */
    .card-shimmer {
      pointer-events: none;
      position: absolute;
      inset: 0;
      border-radius: inherit;
      z-index: 2;
      background:
        linear-gradient(
          105deg,
          transparent 0%,
          transparent 38%,
          rgba(255, 255, 255, 0.0) 42%,
          rgba(255, 252, 240, 0.22) 48%,
          rgba(255, 255, 255, 0.08) 52%,
          transparent 58%,
          transparent 100%
        );
      background-size: 220% 100%;
      mix-blend-mode: soft-light;
      opacity: 0.85;
      animation: shimmerSweep 9s ease-in-out infinite;
      -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 52%, transparent 72%);
      mask-image: linear-gradient(to bottom, #000 0%, #000 52%, transparent 72%);
    }

    /* Lightweight sparkle canvas (sky/beach) */
    .sparkle-canvas {
      pointer-events: none;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      border-radius: inherit;
    }

    /* Floating petal accents around the card */
    .petal-field {
      pointer-events: none;
      position: absolute;
      inset: -12% -8% -8% -8%;
      z-index: 0;
      overflow: visible;
    }
    .petal {
      position: absolute;
      width: 10px;
      height: 14px;
      border-radius: 50% 50% 50% 0;
      background: linear-gradient(145deg, #f2d6c4 0%, #e8b4a0 45%, #c98a78 100%);
      opacity: 0.55;
      transform: rotate(35deg);
      filter: blur(0.2px);
      animation: petalDrift var(--dur, 14s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
      left: var(--x, 10%);
      top: var(--y, 0%);
    }
    .petal.leaf {
      width: 12px;
      height: 18px;
      border-radius: 0 70% 40% 70%;
      background: linear-gradient(160deg, #a8c09a 0%, #6f8f6a 70%, #557554 100%);
      opacity: 0.4;
    }
    .petal.gold {
      background: linear-gradient(145deg, #f0e0b8 0%, #d4b36a 55%, #b8954a 100%);
      opacity: 0.45;
      width: 8px;
      height: 11px;
    }

    .details {
      display: grid;
      gap: 1rem;
      grid-template-columns: 1fr;
      animation: fadeUp 1s 0.28s ease both;
    }
    @media (min-width: 640px) {
      .details { grid-template-columns: 1fr 1fr; }
      .details .span-2 { grid-column: 1 / -1; }
    }

    .panel {
      background: rgba(255, 250, 244, 0.82);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(184, 149, 74, 0.28);
      border-radius: 14px;
      padding: 1.35rem 1.25rem 1.4rem;
      text-align: center;
    }
    .panel h2 {
      font-size: 0.75rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--sage);
      font-weight: 600;
      margin-bottom: 0.65rem;
    }
    .panel .big {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .panel .muted {
      color: var(--sage-soft);
      margin-top: 0.25rem;
      font-size: 1.05rem;
    }
    .divider {
      width: 48px;
      height: 1px;
      margin: 0.85rem auto;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin-top: 0.35rem;
    }
    .btn {
      appearance: none;
      border: 1px solid rgba(184, 149, 74, 0.55);
      background: var(--cream);
      color: var(--ink);
      font-family: inherit;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 0.7rem 1.1rem;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 2px 8px rgba(61, 52, 41, 0.06);
    }
    .btn:hover {
      background: #fff;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(61, 52, 41, 0.1);
    }
    .btn.primary {
      background: linear-gradient(135deg, #c4a35a, #b8954a 55%, #9a7a38);
      border-color: transparent;
      color: #fffaf4;
    }
    .btn.primary:hover { filter: brightness(1.05); }

    .note {
      margin-top: 1.5rem;
      text-align: center;
      font-style: italic;
      color: var(--sage-soft);
      font-size: 1.05rem;
      animation: fadeUp 1s 0.4s ease both;
    }

    footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.85rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(95, 122, 99, 0.75);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes kenBurns {
      0%   { transform: scale(1) translate(0, 0); }
      33%  { transform: scale(1.045) translate(-1.2%, -0.6%); }
      66%  { transform: scale(1.06) translate(0.8%, -1.1%); }
      100% { transform: scale(1.03) translate(-0.4%, 0.5%); }
    }

    @keyframes shimmerSweep {
      0%, 12% { background-position: 120% 0; opacity: 0.35; }
      45%, 55% { background-position: 40% 0; opacity: 0.9; }
      88%, 100% { background-position: -20% 0; opacity: 0.4; }
    }

    @keyframes petalDrift {
      0% {
        transform: translate3d(0, 0, 0) rotate(20deg) scale(1);
        opacity: 0;
      }
      8% { opacity: 0.55; }
      50% {
        transform: translate3d(18px, 42px, 0) rotate(140deg) scale(1.05);
        opacity: 0.45;
      }
      92% { opacity: 0.35; }
      100% {
        transform: translate3d(-12px, 88px, 0) rotate(260deg) scale(0.92);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
      .invite-card { transform: none !important; }
      .card-shimmer,
      .sparkle-canvas,
      .petal-field { display: none !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero-intro">
      <p class="guest-hello" id="guest-hello"></p>
      <p class="eyebrow">Wedding invitation</p>
      <h1 class="names">Thao <span class="amp">&amp;</span> Trung</h1>
      <p class="sub">request the pleasure of your company</p>
    </header>

    <div class="card-stage">
      <div class="petal-field" aria-hidden="true" id="petal-field"></div>
      <figure class="card-wrap">
        <img
          class="invite-card"
          id="invite-card"
          src="card.jpg"
          width="1400"
          height="933"
          alt="Wedding invitation for Thao and Trung — Saturday 26 December 2026 at 4:00 PM, Furama Resort, Da Nang"
        />
        <div class="card-shimmer" aria-hidden="true"></div>
        <canvas class="sparkle-canvas" id="sparkle-canvas" aria-hidden="true"></canvas>
      </figure>
    </div>

    <section class="details" aria-label="Wedding details">
      <article class="panel">
        <h2>When</h2>
        <p class="big">Saturday, 26 December 2026</p>
        <p class="muted">4:00 PM</p>
        <div class="divider" aria-hidden="true"></div>
        <div class="actions">
          <a class="btn primary" id="add-cal" href="#">Add to calendar</a>
        </div>
      </article>

      <article class="panel">
        <h2>Where</h2>
        <p class="big">Furama Resort</p>
        <p class="muted">Da Nang, Vietnam</p>
        <div class="divider" aria-hidden="true"></div>
        <div class="actions">
          <a
            class="btn"
            href="https://www.google.com/maps/search/?api=1&query=Furama%20Resort%20Da%20Nang"
            target="_blank"
            rel="noopener noreferrer"
          >Open map</a>
        </div>
      </article>

      <article class="panel span-2">
        <h2>Share</h2>
        <p class="muted" style="margin-bottom: 0.85rem;" id="share-hint">Send this personalized invite</p>
        <div class="actions">
          <button type="button" class="btn primary" id="copy-link">Copy link</button>
          <a class="btn" id="share-native" href="#" hidden>Share…</a>
        </div>
        <p class="muted" id="copy-status" style="margin-top: 0.75rem; min-height: 1.2em;" aria-live="polite"></p>
      </article>
    </section>

    <p class="note">We can't wait to celebrate with you.</p>
    <footer>Thao &amp; Trung · 26.12.2026</footer>
  </main>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var guest = (params.get("to") || params.get("guest") || "").trim();
      var hello = document.getElementById("guest-hello");
      if (guest) {
        try { guest = decodeURIComponent(guest); } catch (e) {}
        guest = guest.replace(/[<>&\"']/g, "");
        if (guest) {
          hello.textContent = "Dear " + guest + ",";
          hello.classList.add("is-on");
          document.title = "Dear " + guest + " — Thao & Trung";
          var desc = document.querySelector('meta[name="description"]');
          if (desc) desc.setAttribute("content", "Dear " + guest + " — you're invited to the wedding of Thao & Trung, 26 December 2026 at Furama Resort, Da Nang.");
        }
      }

      // ICS calendar download (local afternoon Da Nang = ICT, UTC+7)
      // 16:00 ICT = 09:00 UTC on 2026-12-26; end assume 3 hours
      var ics = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//Thao & Trung Wedding//EN",
        "CALSCALE:GREGORIAN",
        "METHOD:PUBLISH",
        "BEGIN:VEVENT",
        "UID:thao-trung-wedding-20261226@invite",
        "DTSTAMP:20260905T000000Z",
        "DTSTART:20261226T090000Z",
        "DTEND:20261226T120000Z",
        "SUMMARY:Wedding of Thao & Trung",
        "LOCATION:Furama Resort\\, Da Nang\\, Vietnam",
        "DESCRIPTION:Wedding celebration of Thao & Trung at Furama Resort\\, Da Nang. Ceremony begins at 4:00 PM.",
        "END:VEVENT",
        "END:VCALENDAR"
      ].join("
");

      var calBtn = document.getElementById("add-cal");
      calBtn.addEventListener("click", function (e) {
        e.preventDefault();
        var blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "Thao-Trung-Wedding.ics";
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      });

      var statusEl = document.getElementById("copy-status");
      var copyBtn = document.getElementById("copy-link");
      copyBtn.addEventListener("click", async function () {
        try {
          await navigator.clipboard.writeText(window.location.href);
          statusEl.textContent = "Link copied.";
        } catch (err) {
          statusEl.textContent = "Copy this URL from your browser address bar.";
        }
      });

      var shareBtn = document.getElementById("share-native");
      if (navigator.share) {
        shareBtn.hidden = false;
        shareBtn.addEventListener("click", function (e) {
          e.preventDefault();
          navigator.share({
            title: "Thao & Trung — Wedding Invitation",
            text: "You're invited — 26 December 2026 · 4:00 PM · Furama Resort, Da Nang",
            url: window.location.href
          }).catch(function () {});
        });
      }

      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduceMotion) return;

      /* Floating petal / leaf accents around the card */
      var field = document.getElementById("petal-field");
      if (field) {
        var specs = [
          { x: "4%",  y: "8%",  dur: "16s", delay: "0s",    cls: "" },
          { x: "88%", y: "12%", dur: "18s", delay: "2.2s",  cls: "leaf" },
          { x: "12%", y: "55%", dur: "14s", delay: "1s",    cls: "gold" },
          { x: "92%", y: "48%", dur: "17s", delay: "3.5s",  cls: "" },
          { x: "6%",  y: "78%", dur: "15s", delay: "0.8s",  cls: "leaf" },
          { x: "78%", y: "72%", dur: "19s", delay: "4s",    cls: "gold" },
          { x: "48%", y: "-2%", dur: "13s", delay: "1.6s",  cls: "" },
          { x: "62%", y: "90%", dur: "16s", delay: "2.8s",  cls: "leaf" }
        ];
        specs.forEach(function (s) {
          var el = document.createElement("span");
          el.className = "petal" + (s.cls ? " " + s.cls : "");
          el.style.setProperty("--x", s.x);
          el.style.setProperty("--y", s.y);
          el.style.setProperty("--dur", s.dur);
          el.style.setProperty("--delay", s.delay);
          field.appendChild(el);
        });
      }

      /* Soft light motes over beach/sky band */
      var canvas = document.getElementById("sparkle-canvas");
      var wrap = canvas && canvas.parentElement;
      if (!canvas || !wrap) return;

      var ctx = canvas.getContext("2d");
      var particles = [];
      var raf = 0;
      var last = 0;

      function resize() {
        var rect = wrap.getBoundingClientRect();
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(1, Math.floor(rect.width * dpr));
        canvas.height = Math.max(1, Math.floor(rect.height * dpr));
        canvas.style.width = rect.width + "px";
        canvas.style.height = rect.height + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        return rect;
      }

      function spawn(w, h, n) {
        particles = [];
        for (var i = 0; i < n; i++) {
          particles.push({
            x: Math.random() * w,
            y: Math.random() * h * 0.58,
            r: 0.6 + Math.random() * 1.6,
            a: 0.15 + Math.random() * 0.45,
            vx: (Math.random() - 0.5) * 0.12,
            vy: -0.02 - Math.random() * 0.08,
            phase: Math.random() * Math.PI * 2,
            speed: 0.4 + Math.random() * 0.8
          });
        }
      }

      function tick(t) {
        raf = requestAnimationFrame(tick);
        if (!last) last = t;
        var dt = Math.min(32, t - last) / 16.67;
        last = t;
        var w = canvas.clientWidth;
        var h = canvas.clientHeight;
        ctx.clearRect(0, 0, w, h);
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          p.phase += 0.02 * p.speed * dt;
          p.x += (p.vx + Math.sin(p.phase) * 0.08) * dt;
          p.y += p.vy * dt;
          if (p.y < -4) { p.y = h * 0.55; p.x = Math.random() * w; }
          if (p.x < -4) p.x = w + 2;
          if (p.x > w + 4) p.x = -2;
          var twinkle = 0.55 + 0.45 * Math.sin(p.phase * 1.7);
          ctx.beginPath();
          ctx.fillStyle = "rgba(255, 248, 230," + (p.a * twinkle) + ")";
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      var rect = resize();
      spawn(rect.width, rect.height, 28);
      raf = requestAnimationFrame(tick);

      window.addEventListener("resize", function () {
        var r = resize();
        spawn(r.width, r.height, 28);
      });

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) {
          cancelAnimationFrame(raf);
          raf = 0;
          last = 0;
        } else if (!raf) {
          raf = requestAnimationFrame(tick);
        }
      });
    })();
  </script>
</body>
</html>
